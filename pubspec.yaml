name: uni_planner
description: "CMD Uni - local-only app, no account and no server."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  # SQLite via dart:ffi for Windows/Linux desktop (same schema as mobile).
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  decimal: ^3.2.6
  rational: ^2.2.3
  fl_chart: ^1.3.0
  table_calendar: ^3.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  open_filex: ^5.0.0
  url_launcher: ^6.3.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14161C"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
